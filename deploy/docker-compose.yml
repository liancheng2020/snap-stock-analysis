services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000/api
    ports:
      - '3000:3000'
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    ports:
      - '8000:8000'
    environment:
      CORS_ORIGINS: http://localhost:3000
